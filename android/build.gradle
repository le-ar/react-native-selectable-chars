buildscript {
    def kotlinVersion = rootProject.ext.has('kotlinVersion') ? rootProject.ext.kotlinVersion : '2.1.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.facebook.react'

react {
    libraryName = 'RNSelectCharsSpec'
    codegenJavaPackageName = 'com.andrei.reactnativeselectchars'
}

def extOrDefault(name, fallback) {
    rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

android {
    namespace 'com.andrei.reactnativeselectchars'
    compileSdk extOrDefault('compileSdkVersion', 36)
    defaultConfig {
        minSdk extOrDefault('minSdkVersion', 24)
        targetSdk extOrDefault('targetSdkVersion', 36)
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    sourceSets.main.java.srcDir "$buildDir/generated/source/codegen/java"
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'com.facebook.react:react-android'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    testImplementation 'junit:junit:4.13.2'
}
